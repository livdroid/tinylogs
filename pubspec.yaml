name: tinylogs
description: Un package Flutter simple et rapide pour logger des informations dans une base de données SQLite locale avec gestion automatique de l'historique.
version: 1.0.0
homepage: https://github.com/oliviarodriguewinminute/tinylogs

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.0
